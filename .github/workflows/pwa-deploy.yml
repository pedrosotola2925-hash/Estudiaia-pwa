name: PWA CI

on:
  push:
    branches: [main, feat/estudiaia2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Xvfb for Electron tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run unit and UI tests
        run: xvfb-run -a npm test

      - name: Run PWA unit tests
        run: npm run test:pwa

      - name: Build PWA
        run: npm run build:pwa

      - name: Upload PWA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-pwa
          path: dist-pwa/
          retention-days: 7

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build PWA
        run: npm run build:pwa

      - name: Run PWA e2e tests
        run: npx playwright test --config=playwright.pwa.config.cjs

      - name: Upload e2e traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  lighthouse:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build:pwa

      - name: Serve PWA for Lighthouse
        run: |
          npx serve dist-pwa -l 5173 &
          sleep 5

      - name: Run Lighthouse PWA audit
        run: |
          npx lighthouse http://localhost:5173 \
            --only-categories=pwa \
            --output=json \
            --output-path=./lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu"

      - name: Check PWA score
        run: |
          SCORE=$(jq '.categories.pwa.score * 100' lighthouse-report.json)
          echo "PWA score: $SCORE"
          if (( $(echo "$SCORE < 90" | bc -l) )); then
            echo "PWA score below 90"
            exit 1
          fi

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 7