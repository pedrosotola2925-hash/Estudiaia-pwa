name: PWA CI

on:
  push:
    branches: [main, feat/estudiaia2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Node unit tests
        run: npm run test:unit

      - name: Run PWA unit tests
        run: npm run test:pwa

      - name: Build PWA
        run: npm run build:pwa

      - name: Upload PWA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-pwa
          path: dist-pwa/
          retention-days: 7

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build PWA
        run: npm run build:pwa

      - name: Run PWA e2e tests
        run: npx playwright test --config=playwright.pwa.config.cjs

      - name: Upload e2e traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
